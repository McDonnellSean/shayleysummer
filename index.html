<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayley Summer — July 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <p class="eyebrow">Shayley Summer</p>
    <h1>July 2026</h1>
    <p class="subtitle">Every day between now and July 25th, mapped out.</p>
  </header>

  <main>
    <div class="calendar-wrap">
      <div class="weekday-labels">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div class="calendar" id="calendar"></div>
    </div>

    <div class="legend">
      <span class="dot weekday"></span> Weekday hangout
      <span class="dot weekend"></span> Weekend plan
      <span class="dot special"></span> Special
    </div>
  </main>

  <div class="modal-overlay" id="overlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <p class="modal-date" id="modalDate"></p>
      <div class="modal-activities" id="modalActivities"></div>
      <form class="add-form" id="addForm">
        <input type="text" id="addInput" placeholder="Coffee → beach walk" autocomplete="off" required>
        <div class="add-form-row">
          <select id="addType">
            <option value="weekday">Weekday hangout</option>
            <option value="weekend">Weekend plan</option>
            <option value="special">Special</option>
          </select>
          <button type="submit">Add</button>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <p>made with ♡ for the summer</p>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
